[package]
name = "releste-plugin-clock"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Sample Releste .so plugin: logs one line per second of game time"

# Standalone workspace: not part of the main workspace (AGENTS.md 15.1) and
# dependency-free, so `cargo build --release` needs no network.
[workspace]

[lib]
name = "clock"
crate-type = ["cdylib"]

[lints.rust]
warnings = "deny"
