[package]
name = "releste-content-pipeline"
version.workspace = true
edition.workspace = true

# Two binaries now, so `cargo run -p releste-content-pipeline` must keep picking the
# original pipeline (README/AGENTS/ROADMAP snippets rely on it).
default-run = "releste-content-pipeline"

[[bin]]
name = "releste-content-pipeline"
path = "src/main.rs"

# One binary per input format. `smh2releste` repackages an Everest Skin Mod Helper
# skin (zip or directory) into the `resources/<namespace>/` layout; future converters
# (Aseprite tilesets, CelesteNet skins, ...) follow the same shape.
[[bin]]
name = "smh2releste"
path = "src/bin/smh2releste.rs"

[dependencies]
releste-math = { path = "../../crates/math" }
releste-world = { path = "../../crates/world" }
releste-map = { path = "../../crates/map" }
# Shared Appendix A log format (ROADMAP 1.1: kernel/src/log.rs is the home).
releste-kernel = { path = "../../crates/kernel" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
toml.workspace = true
serde_yaml.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# Reading `.zip` skin packs (Everest mods ship as archives). Build-time only, and only
# the read path + flate2 deflate are enabled: the default features pull zopfli/bzip2/lzma.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
