# Releste 编辑器语言包 - zh_CN（简体中文，UTF-8）。
#
# 本文件是运行时数据，不是源代码。编辑器在启动和切换语言时从磁盘读取，
# 永远不会被编译进二进制文件。
#
# 翻译约定：
#   - 术语表见 CONTRIBUTING-i18n.md，请勿自行改动已定术语。
#   - {name} 是占位符，渲染时替换；不要翻译花括号里的名字，只翻译它周围。
#   - 键名必须与 locales/en_US/editor.toml 完全一致，不要增删。
#   - 本文件天然包含非 ASCII 字节，这是允许的：仓库的 ASCII 检查会跳过
#     路径中包含 locale 的文件（见 docs/i18n.md 第 7 节）。
#
# 译文评审须由母语者完成。

