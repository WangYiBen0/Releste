# Releste editor catalog - en_US (source of truth).
#
# This file is RUNTIME DATA, not source code. The editor reads it from disk at
# startup and when the language is switched. It is never compiled in.
#
# Rules for this file:
#   - Keys are stable dot-separated identifiers, lowercase; see docs/i18n.md 5.
#   - Placeholders use {name} and are substituted at render time; see
#     docs/i18n.md 4.1.
#   - Never reorder or rename a key without updating every other catalog and
#     the call sites in the same change.
#   - Add new keys HERE first, then translate them in each other catalog.
#
# To add a language, read CONTRIBUTING-i18n.md.

