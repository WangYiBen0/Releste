[package]
name = "releste-script"
version.workspace = true
edition.workspace = true

[features]
default = []
# Lua cutscene scripting layer (mlua + vendored LuaJIT).
#
# Requires `make` and a C toolchain to build vendored LuaJIT. If the
# environment lacks `make`, keep this feature off: `CutsceneBridge` and
# `SimCommand` remain usable, and the simulation layer does not depend on Lua.
lua = ["dep:mlua"]

[dependencies]
releste-math = { path = "../math" }
releste-world = { path = "../world" }
releste-kernel = { path = "../kernel" }
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
mlua = { workspace = true, optional = true }
