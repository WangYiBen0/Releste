# Ground dash: 240 px/s for 0.15s, then 160 px/s for the tail, and one dash
# is consumed.
#
#   DashSpeed 240f   (pureCeleste.cs:122745) -> 4 px/tick
#   DashEnd 160f     (pureCeleste.cs:122824) -> 8/3 px/tick
#   0.15s = 9 ticks  (pureCeleste.cs:122817)
#   dashes 1 -> 0    (DashBegin, around pureCeleste.cs:122534)
[scenario]
ticks = 40
map = "0-Intro.map"
note = "walk right for 2 ticks, press dash on tick 6"

[[input]]
from = 5
to = 8
right = true

[[input]]
from = 6
to = 6
dash = true

[[expect]]
tick = 6
state = 2              # Dash state
dashes = 0

[[expect]]
tick = 12
state = 2
vx = 4.0               # 240 px/s

[[expect]]
tick = 16
vx = 4.0

[[expect]]
tick = 20
state = 0              # dash over, back to Normal
vx = 2.389             # the 160 px/s tail, already reduced one 1000-rate step

[[expect]]
tick = 30
vx = 0.0
anim = "idle"
