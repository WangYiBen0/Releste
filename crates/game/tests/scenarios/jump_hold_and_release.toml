# Jumping: while the button is held the vertical speed is pinned at the jump
# speed; releasing hands control straight back to gravity.
#
#   JumpSpeed = -105f                      (pureCeleste.cs:120705) -> -1.75 px/tick
#   varJumpTimer pins Speed.Y while held   (pureCeleste.cs:122042-122048)
#   MaxFall = 160f                         (pureCeleste.cs:118376) -> 2.667 px/tick
#   fallFast threshold is Speed.Y >= 160f  (pureCeleste.cs:120483)
[scenario]
ticks = 45
map = "0-Intro.map"
note = "hold jump from tick 5, release at tick 12 (an 8-tick short hop)"

[[input]]
from = 5
to = 12
jump = true

[[expect]]
tick = 5
vy = -1.75             # the jump starts at vanilla -105 px/s
anim = "jumpSlow"

[[expect]]
tick = 11
vy = -1.75             # still pinned by varJump; gravity does not apply

[[expect]]
tick = 15
dy = -17.75            # after release gravity takes over: no longer linear
vy = -1.0

[[expect]]
tick = 30
vy = 2.667             # terminal fall = MaxFall 160 px/s
anim = "fallFast"

[[expect]]
tick = 45
dy = 0.0               # back on the ground
vy = 0.0
on_ground = true
