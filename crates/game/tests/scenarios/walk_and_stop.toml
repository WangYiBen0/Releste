# Walking: accelerate -> top speed -> release -> decelerate -> stop (+ the
# animation chain).
#
# Every expectation is derived from the vanilla constants, not copied from
# whatever the engine prints today:
#   MaxRun = 90f      (pureCeleste.cs:118386) -> 1.5 px/tick
#   RunAccel = 1000f  (pureCeleste.cs:118388) -> 1/60*1000 = 0.27778 px/tick^2
#   releasing the input decelerates at the full 1000 rate
#   (pureCeleste.cs:121965-121975; the 400 rate is for same-direction overspeed)
#
# Displacement uses dx (relative to tick 1) so a different map or spawn point
# cannot cause false alarms.
[scenario]
ticks = 60
map = "0-Intro.map"
note = "walk right for 36 ticks from spawn, then release and wait 20"

[[input]]
from = 5
to = 40
right = true

[[expect]]
tick = 5
vx = 0.2778            # first tick only accelerates by 1/60*1000
anim = "runSlow"

[[expect]]
tick = 10
vx = 1.5               # top speed 90 px/s reached
anim = "runFast"

[[expect]]
tick = 40
vx = 1.5
dx = 50.667            # ramp + top-speed displacement

[[expect]]
tick = 50
vx = 0.0
dx = 54.0
anim = "idle"
on_ground = true
