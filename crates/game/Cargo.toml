[package]
name = "releste-game"
version.workspace = true
edition.workspace = true

[[bin]]
name = "releste"
path = "src/main.rs"

[dependencies]
releste-math = { path = "../math" }
releste-kernel = { path = "../kernel" }
releste-map = { path = "../map" }
releste-reload = { path = "../reload" }
releste-render = { path = "../render" }
releste-world = { path = "../world" }
releste-plugin-host = { path = "../plugin-host" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
winit.workspace = true
wgpu.workspace = true
libloading.workspace = true
# `--screenshot` 把渲染帧落成 PNG。
image.workspace = true
# 用户设置（settings.toml）：按键绑定持久化（栈规范 §2：配置用 toml）。
serde.workspace = true
toml.workspace = true
# `--trace` / `--script` / `--dump-map` 的机器可读输出（调试工具）。
serde_json.workspace = true
