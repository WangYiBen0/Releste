[package]
name = "releste-game"
version.workspace = true
edition.workspace = true

[[bin]]
name = "releste"
path = "src/main.rs"

[dependencies]
releste-math = { path = "../math" }
releste-kernel = { path = "../kernel" }
releste-map = { path = "../map" }
releste-reload = { path = "../reload" }
releste-render = { path = "../render" }
releste-world = { path = "../world" }
releste-plugin-host = { path = "../plugin-host" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
winit.workspace = true
wgpu.workspace = true
libloading.workspace = true
# `--screenshot` writes the rendered frame to a PNG.
image.workspace = true
# User settings (settings.toml): persisted key bindings (stack spec 2: config uses toml).
serde.workspace = true
toml.workspace = true
# Machine-readable output for `--trace` / `--script` / `--dump-map` (dev tools).
serde_json.workspace = true
