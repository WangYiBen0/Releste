[package]
name = "reles-input"
version.workspace = true
edition.workspace = true

[features]
default = []
# Gamepad support requires system libudev (Linux) / XInput (Windows).
# Keep disabled when the environment lacks pkg-config.
gamepad = ["dep:gilrs"]

[dependencies]
reles-math = { path = "../math" }
reles-kernel = { path = "../kernel" }
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
gilrs = { workspace = true, optional = true }
