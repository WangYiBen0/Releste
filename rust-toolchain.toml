# Single source of truth: Cargo and Nix use the same toolchain.
#
# - local: rustup / cargo read this file automatically
# - Nix:   the flake reads it through fenix (fromToolchainFile in nix/rust.nix)
#
# So rustc / rustfmt / clippy are always the same version and
# "fmt passed locally, the nix build's fmt failed" cannot happen.
#
# Note: this file pins the *development* toolchain; Cargo.toml's rust-version
# declares the *minimum supported* one (MSRV). Different things.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src"]
profile = "minimal"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # wasm target (the start of Phase 7): with std in place,
    # `cargo check --target wasm32-unknown-unknown` verifies portability.
    "wasm32-unknown-unknown",
]
